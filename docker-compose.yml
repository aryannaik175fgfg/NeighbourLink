services:
  db:
    image: postgis/postgis:16-3.4
    container_name: neighbourlink-db
    environment:
      POSTGRES_USER: neighbourlink
      POSTGRES_PASSWORD: neighbourlink_dev
      POSTGRES_DB: neighbourlink
    ports:
      - "5432:5432"
    volumes:
      - neighbourlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighbourlink -d neighbourlink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neighbourlink_pgdata:
